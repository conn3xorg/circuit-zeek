name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Rootful, so the container can be given NET_RAW for packet capture.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-zeek systemctl is-active zeek zeek-cron.timer
      # Makes a DNS lookup and an HTTP request from inside the host, then
      # checks Zeek logged both, as JSON, on eth0: the lookup in dns.log, the
      # request in http.log, and its connection in conn.log.
      - name: Check Zeek runs and logs the host's traffic
        run: |
          sudo podman exec -i circuit-zeek sh -eu <<'EOF'
          /opt/zeek/bin/zeekctl status | grep -Eq '^zeek +standalone +localhost +running'
          getent hosts example.org
          curl -sSf -o /dev/null http://example.com/
          logs=/opt/zeek/logs/current
          for _ in $(seq 30); do
            uid=$(grep -h '"host":"example.com"' $logs/http.log 2>/dev/null | sed -n 's/.*"uid":"\([^"]*\)".*/\1/p' | head -n 1)
            if [ -n "$uid" ] && grep -q "\"uid\":\"$uid\"" $logs/conn.log 2>/dev/null \
              && grep -q '"query":"example.org"' $logs/dns.log 2>/dev/null; then
              for f in conn dns http; do
                python3 -c 'import json, sys; [json.loads(l) for l in open(sys.argv[1])]' $logs/$f.log
              done
              exit 0
            fi
            sleep 1
          done
          exit 1
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
